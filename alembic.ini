# Alembic configuration for riptide.
# Migrations are hand-written raw SQL (no autogenerate): the schema uses RLS
# policies, triggers, SECURITY DEFINER functions and custom roles that Alembic
# cannot reflect. The connection URL is supplied at runtime by env.py from
# MIGRATION_DATABASE_URL (schema owner, sync psycopg driver).

[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os
# sqlalchemy.url is intentionally left blank; env.py sets it from the environment.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
